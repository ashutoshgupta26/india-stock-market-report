name: Update prices and news

on:
  schedule:
    # Market hours (IST 09:00-15:45, Mon-Fri): every 5 minutes. GitHub may delay scheduled runs by a few minutes.
    - cron: "30-59/5 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0-15/5 10 * * 1-5"
    # Outside market hours: news every hour (IST ~06:30-23:30, every day)
    - cron: "0 1-2,11-18 * * *"
    - cron: "0 3-10 * * 0,6"
  push:
    branches: [main]
  workflow_dispatch:

# Data is published straight to GitHub Pages and never committed, so the repo does not grow.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Load the last published data
        run: |
          for f in data.json news.json; do
            curl -fsSL -m 20 "https://ashutoshgupta26.github.io/india-stock-market-report/$f?t=$(date +%s)" -o "$f.tmp" && mv "$f.tmp" "$f" || rm -f "$f.tmp"
          done
      - name: Fetch prices
        run: node scripts/update-prices.mjs
        continue-on-error: true
      - name: Fetch news and build commentary
        run: node scripts/update-news.mjs
        continue-on-error: true
      - name: Build site
        run: |
          test -s data.json || { echo "No data.json, keeping the current site"; exit 1; }
          mkdir _site
          cp index.html data.json _site/
          [ -s news.json ] && cp news.json _site/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
