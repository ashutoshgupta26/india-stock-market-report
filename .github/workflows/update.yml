name: Update prices

on:
  schedule:
    # NSE session 09:15-15:30 IST = 03:45-10:00 UTC, Mon-Fri (with a small buffer).
    - cron: "30-59/5 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0-15/5 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch prices
        run: node scripts/update-prices.mjs
      - name: Commit data.json if changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No change in data.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update market data $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
