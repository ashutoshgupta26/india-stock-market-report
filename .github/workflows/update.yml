name: Update prices and news

on:
  schedule:
    # Market hours (IST 09:00-15:45, Mon-Fri): every 5 minutes. GitHub may delay scheduled runs by a few minutes.
    - cron: "30-59/5 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0-15/5 10 * * 1-5"
    # Outside market hours: news every hour (IST ~06:30-23:30, every day)
    - cron: "0 1-2,11-18 * * *"
    - cron: "0 3-10 * * 0,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch prices
        run: node scripts/update-prices.mjs
        continue-on-error: true
      - name: Fetch news and build commentary
        run: node scripts/update-news.mjs
        continue-on-error: true
      - name: Commit changes
        run: |
          if git diff --quiet -- data.json news.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json news.json
          git commit -m "Update market data $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
